spring.application.name=sobra-solidaria
server.port=${PORT:8080}

# Conexão com o Oracle da FIAP (valores vêm de variáveis de ambiente, nunca do código)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# O script SQL é executado manualmente no banco (ver sql/script-oracle.sql)
spring.sql.init.mode=never

# CORS: lista separada por vírgula. "*" libera qualquer origem (útil para o front local).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Nunca expor stack trace nem detalhes internos nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
